[package]
name = "pierre"
version = "0.2.0"
edition = "2021"
repository = "https://github.com/gleicon/pierre"
license = "MIT"
description = "A single-binary log indexer in Rust: real full-text search, tiered storage, and pre-computed aggregations, built on the edgestore embedded storage engine."
readme = "README.md"
keywords = ["logs", "logging", "search", "observability", "database"]
categories = ["database-implementations", "command-line-utilities"]

[lib]
name = "pierre"
path = "src/lib.rs"

[[bin]]
name = "pierre"
path = "src/main.rs"

[dependencies]
edgestore = "1.5.0"
edgestore-tokio = { version = "1.5.0", features = ["tier"] }
edgestore-repl = "1.5.0"
edgestore-tier = "1.5.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
axum = "0.8"
hyperloglogplus = "0.4.1"
sketches-ddsketch = { version = "0.4.0", features = ["use_serde"] }
prost = "0.14"
prost-types = "0.14"
snap = "1"
rand = "0.8"
jiff = { version = "0.2", default-features = false, features = ["std"] }
tonic = "0.14"
tonic-prost = "0.14"

[build-dependencies]
prost-build = "0.14"
tonic-prost-build = "0.14"

[features]
default = []
s3 = ["edgestore-repl/s3"]

[[example]]
name = "bench_s3_localstack"
required-features = ["s3"]

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
