// Wire-compatible subset of Loki's real push protocol
// (https://github.com/grafana/loki/blob/main/pkg/push/push.proto), stripped of
// gogoproto extensions (Go-specific codegen options; irrelevant to wire format —
// field numbers and types are what determine compatibility, and those are kept
// identical to the upstream schema).
syntax = "proto3";

package logproto;

import "google/protobuf/timestamp.proto";

message PushRequest {
  repeated StreamAdapter streams = 1;
  string format = 2;
}

message StreamAdapter {
  string labels = 1;
  repeated EntryAdapter entries = 2;
  uint64 hash = 3;
}

message LabelPairAdapter {
  string name = 1;
  string value = 2;
}

message EntryAdapter {
  google.protobuf.Timestamp timestamp = 1;
  string line = 2;
  repeated LabelPairAdapter structuredMetadata = 3;
  repeated LabelPairAdapter parsed = 4;
}
